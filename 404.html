<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2029">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>404 | Janyris Cotto</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/theme-init.js"></script>
<link rel="preload" href="/fonts/iosevka-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="notfound">
  <div class="frame notfound-frame">
    <div class="frame-bar">
      <div class="frame-path">~$</div>
    </div>
    <div class="frame-body notfound-body">
      <p><span class="notfound-prompt">$</span> cd <span id="missingPath">/this-page</span></p>
      <p class="notfound-error">bash: cd: no such file or directory</p>
      <p class="notfound-hint">exit code 404. The page you tried to open doesn't exist or has moved.</p>
      <p><a class="item-link" href="/">cd ~ (back home)</a></p>
    </div>
  </div>
</main>
<script src="/404.js"></script>
</body>
</html>
